spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/siwarga
    username: ${DB_USER:siwarga}
    password: ${DB_PASS:siwarga}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:iXG1lBTYhZZu78t14GS5Yge2vdqPcKbNmd6dKF9BC2i}
  expiration-ms: 86400000

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}

logging:
  level:
    com.siwarga: INFO
    org.springframework.security: WARN
